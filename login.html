<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Biblioteca Las Cumbres</title>

    <link rel="stylesheet" href="./estilos.css">
</head>

<body>

    <header class="encabezado">

        <a href="./index.html" class="perfil">
            ←
        </a>

        <h2>
            Biblioteca Las Cumbres
        </h2>

        <div></div>

    </header>


    <main>

        <section class="info">

            <h1>
                Iniciar sesión
            </h1>

            <p>
                Ingresá a tu cuenta para continuar.
            </p>


            <form>

                <label for="correo">
                    Correo electrónico
                </label>

                <br>

                <input
                    type="email"
                    id="correo"
                    placeholder="Ingresá tu correo">

                <br><br>


                <label for="contraseña">
                    Contraseña
                </label>

                <br>

                <input
                    type="password"
                    id="contraseña"
                    placeholder="Ingresá tu contraseña">

                <br><br>


                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

        </section>

    </main>


    <footer>

        <img
            src="./assets/Biblioteca Las Cumbres (1).png"
            alt="Logo Biblioteca Las Cumbres">

        <p>
            Biblioteca Las Cumbres
        </p>

    </footer>

</body>

</html>
