<!doctype html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de sesión - Biblioteca Las Cumbres</title>

    <link rel="stylesheet" href="estilos.css">

</head>


<body>


<main class="pagina-formulario">


<section class="info">


<img 
src="./assets/Biblioteca Las Cumbres (1).png"
alt="Logo Biblioteca Las Cumbres"
style="width:120px;">


<h1>
Biblioteca Las Cumbres
</h1>


<p>
Ingresá a tu cuenta para acceder a la biblioteca.
</p>



<form action="biblioteca.html">


<label>
Correo electrónico
</label>

<br>


<input 
type="email"
placeholder="Ingresá tu Gmail"
required>


<br><br>



<label>
Contraseña
</label>

<br>


<input
type="password"
placeholder="Ingresá tu contraseña"
required>


<br><br>



<button type="submit">
Iniciar sesión
</button>


</form>


</section>


</main>


</body>

</html>
