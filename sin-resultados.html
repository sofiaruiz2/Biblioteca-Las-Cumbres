<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buscar - Biblioteca Las Cumbres</title>

    <link rel="stylesheet" href="./estilos.css">
</head>

<body>

    <header class="encabezado">

        <a href="./index.html" class="perfil">
            ←
        </a>

        <h2>
            Biblioteca Las Cumbres
        </h2>

        <div></div>

    </header>


    <main>

        <section class="buscador-principal">

            <div class="busqueda">

                <input
                    type="search"
                    placeholder="Buscar libros, autores..."
                    aria-label="Buscar libros o autores">

                <a
                    class="lupa"
                    href="./sin-resultados.html"
                    aria-label="Buscar">
                    ⌕
                </a>

            </div>


            <div class="busqueda-vacia">

                <h1>
                    No encontramos resultados
                </h1>

                <p>
                    Probá buscando otro libro o autor.
                </p>

                <br>

                <a href="./index.html">
                    Volver al inicio
                </a>

            </div>

        </section>

    </main>


    <footer>

        <img
            src="./assets/Biblioteca Las Cumbres (1).png"
            alt="Logo Biblioteca Las Cumbres">

        <p>
            Biblioteca Las Cumbres
        </p>

    </footer>


</body>

</html>
